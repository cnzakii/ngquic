[project]
site_name = "ngquic"
site_description = "A fast Sans-I/O QUIC and HTTP/3 library for Python."
site_author = "ngquic contributors"
site_url = "https://ngquic.readthedocs.io/"
copyright = "Copyright &copy; 2026 ngquic contributors"
repo_url = "https://github.com/cnzakii/ngquic"
repo_name = "cnzakii/ngquic"

# English is the source. docs/build.py builds it, then each translation in
# docs/<lang>/ from this same file with the values in docs/translating/<lang>.toml.
docs_dir = "docs/en"
site_dir = "site"
extra_css = ["assets/stylesheets/ngquic.css"]

# Page titles come from each page's front matter, so every language names its
# own pages; only the section labels are translated, in docs/translating/.
nav = [
    "index.md",
    { "Learn" = [
        "learn/first-handshake.md",
        "learn/protocol-model.md",
        "learn/udp.md",
        "learn/http3.md",
    ] },
    { "API reference" = [
        "reference/index.md",
        "reference/connections.md",
        "reference/tls.md",
        "reference/config.md",
        "reference/events.md",
        "reference/errors.md",
        "reference/h3.md",
        "reference/udp.md",
    ] },
    { "Project" = [
        "project/changelog.md",
        "project/security.md",
        "project/contributing.md",
        "project/license.md",
    ] },
]

[project.theme]
variant = "modern"
custom_dir = "docs/overrides"
# System fonts: no third-party font requests, and native CJK glyphs.
font = false
language = "en"
logo = "assets/brand/ngquic-logo.svg"
favicon = "assets/brand/ngquic-favicon.svg"
features = [
    "content.code.copy",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.alternate]]
name = "English"
link = "/"
lang = "en"

[[project.extra.alternate]]
name = "简体中文"
link = "/zh/"
lang = "zh"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]
# Paths are relative to the repository root, so both languages include the
# same examples and project files instead of keeping copies.
base_path = ["."]
check_paths = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
allow_inspection = false
docstring_style = "google"
extensions = ["docs/griffe_stub_overloads.py:StubOverloads"]
filters = ["!^_"]
members_order = "source"
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = false
show_if_no_docstring = true
show_overloads = true
overloads_only = true
show_bases = true
merge_init_into_class = true
modernize_annotations = true
summary = true
show_labels = false
show_source = false
heading_level = 2

[project.plugins.mkdocstrings.handlers.python.options.docstring_options]
# Exact annotations come from the .pyi stubs.
warn_missing_types = false
warn_unknown_params = false
ignore_init_summary = true

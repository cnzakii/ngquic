version: 2

# One project serves every language: English at the root and each translation
# under its language code (site/zh/ is served as /zh/). Set the project's
# versioning scheme to "single version without translations" and its default
# version to `stable`, the latest release.
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      # The reference reads the .pyi stubs, so the extension is never compiled.
      - uv sync --locked --no-dev --group docs --no-install-project
    pre_build:
      # Translations derive their site_url from this one in docs/build.py.
      - sed -i "s|^site_url = .*|site_url = \"$READTHEDOCS_CANONICAL_URL\"|" zensical.toml
    build:
      html:
        - uv run --no-sync python docs/build.py --strict
    post_build:
      - mkdir -p "$READTHEDOCS_OUTPUT/html"
      - cp --recursive site/. "$READTHEDOCS_OUTPUT/html/"

python:
  # Provision uv; generic builders run dependency sync in build.jobs.install.
  install:
    - method: uv
      command: sync
      groups:
        - docs

# Coverage may drop by up to 1% from the base commit, the margin fail_under in
# pyproject.toml keeps below the measured total (CONTRIBUTING.md): each new
# native failure path that tests cannot reach lowers the total slightly.
# fail_under stays the hard floor.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    # A small patch loses about a point per such line, so its coverage is
    # reported without failing the check.
    patch:
      default:
        informational: true

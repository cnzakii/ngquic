repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: Check uv lockfile
        entry: uv lock --check
        language: system
        pass_filenames: false

      - id: ruff-format
        name: Check Python formatting
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false

      - id: ruff-check
        name: Lint Python
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false

      - id: cython-lint
        name: Lint Cython
        entry: uv run --locked cython-lint src/ngquic
        language: system
        pass_filenames: false

      - id: ty
        name: Check Python types
        entry: uv run --locked ty check
        language: system
        pass_filenames: false

      - id: release-notes
        name: Self-test the release notes script
        entry: uv run --locked python .github/scripts/release_notes.py --self-test
        language: system
        pass_filenames: false

      - id: benchmark-environment
        name: Self-test the benchmark environment guard
        entry: uv run --locked python benchmarks/environment.py --self-test
        language: system
        pass_filenames: false

    <circle cx="-4" cy="8" r="1.4" fill="#24704C"/>
    <circle cx="4" cy="8" r="1.4" fill="#24704C"/>
    <path d="M-8 12 Q0 18 8 12" stroke="#24704C" stroke-width="3.2" fill="none" stroke-linecap="round"/>
